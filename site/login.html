<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Masuk &mdash; Hermes Build Lab</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 85% 0, rgba(35, 93, 160, .20), transparent 30%), var(--bg);
    }

    .login-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      background: rgba(8, 17, 31, .70);
      backdrop-filter: blur(12px);
    }

    .login-topbar .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 850;
      font-size: .95rem;
    }

    .login-topbar .brand .brand-mark {
      width: 34px;
      height: 34px;
      font-size: 1.1rem;
    }

    .login-topbar .brand span:first-child {
      display: none;
    }

    .login-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
      text-align: center;
      overflow-y: auto;
    }

    .login-hero .eyebrow {
      margin: 0 0 14px;
      color: var(--cyan);
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .login-hero .hero-mark {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--cyan), #6da5ff);
      color: #07111e;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: 0 18px 44px rgba(94, 234, 212, .25);
      margin-bottom: 20px;
    }

    .login-hero h1 {
      margin: 0 0 16px;
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .login-hero p {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 560px;
      line-height: 1.6;
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 40px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cyan), #6da5ff);
      color: #07111e;
      font-weight: 850;
      font-size: 1.15rem;
      cursor: pointer;
      box-shadow: 0 18px 44px rgba(94, 234, 212, .25);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 52px rgba(94, 234, 212, .30);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(7, 17, 30, .18);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .login-card-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .login-card-wrap.show {
      opacity: 1;
      pointer-events: auto;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 38px;
      background: rgba(16, 29, 48, .97);
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 20px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, .32);
    }

    .login-card .auth-label {
      margin: 0;
      color: var(--cyan);
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .login-card .auth-title {
      margin: 8px 0 0;
      font-size: clamp(1.4rem, 3vw, 1.8rem);
    }

    .login-card .auth-note {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .login-card .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .login-card .field-group label {
      font-size: .8rem;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .03em;
    }

    .login-card .field-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(8, 17, 31, .72);
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .login-card .field-group input::placeholder {
      color: var(--muted);
    }

    .login-card .field-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(94, 234, 212, .16);
    }

    .login-card .field-row {
      display: flex;
      gap: 12px;
    }

    .login-card .field-row .field {
      flex: 1;
    }

    .login-card .icon-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(8, 17, 31, .72);
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: color .15s ease, border-color .15s ease;
    }

    .login-card .icon-button:hover {
      color: var(--ink);
      border-color: var(--cyan);
    }

    .login-card .btn-row {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .login-card .btn-row .primary-button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      border-radius: 14px;
    }

    .login-card .btn-row .ghost-button {
      min-height: 52px;
      padding: 0 20px;
      border-radius: 14px;
    }

    .login-card .field-help {
      margin: 0;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    .login-card .alert {
      margin: 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 82, 82, .12);
      border: 1px solid rgba(255, 82, 82, .35);
      color: #ffb3b3;
      font-size: .86rem;
      display: none;
    }

    .login-card .alert.show {
      display: block;
    }

    @media (max-width: 760px) {
      .login-page {
        flex-direction: column;
      }

      .login-hero {
        padding: 36px 20px 60px;
        overflow-y: visible;
      }

      .login-card-wrap {
        padding: 16px 12px;
        min-height: auto;
        align-items: flex-start;
      }

      .login-card {
        padding: 26px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <header class="login-topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">H</span>
        <span>Hermes</span><span class="sr-only">Build Lab</span>
      </a>
    </header>

    <main class="login-hero">
      <p class="eyebrow">Hermes Build Lab</p>
      <div class="hero-mark">H</div>
      <h1>Jembatan antara ide dan build.</h1>
      <p>Hermes mengatur langkah, OpenCode menulis kode, Docker mengirimkan hasil.</p>
      <button id="openLogin" class="login-btn" type="button">
        <span class="btn-icon" aria-hidden="true">→</span> Masuk
      </button>
    </main>

    <div class="login-card-wrap" id="loginCardWrap">
      <div class="login-card" role="dialog" aria-label="Form login">
        <p class="auth-label">Halaman verifikasi</p>
        <h1 class="auth-title" id="login-title">Silakan masuk.</h1>
        <p class="auth-note">Gunakan kombinasi <strong>Admin</strong> / <strong>Admin</strong> untuk login.</p>

        <div class="alert" role="alert" id="alert"></div>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              placeholder="Admin"
            >
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="field-row">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Admin"
              >
              <button
                class="icon-button"
                type="button"
                id="togglePassword"
                aria-label="Tampilkan password"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="btn-row">
            <button class="primary-button" type="submit">Masuk</button>
            <button class="ghost-button" type="button" id="resetButton">Ulangi</button>
          </div>
        </form>

        <p class="field-help">Demo lokal. Password dicantumkan di dalam halaman ini.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var openButton = document.getElementById("openLogin");
      var cardWrap = document.getElementById("loginCardWrap");
      var form = document.getElementById("loginForm");
      var alertBox = document.getElementById("alert");
      var usernameInput = document.getElementById("username");
      var passwordInput = document.getElementById("password");
      var resetButton = document.getElementById("resetButton");
      var toggleButton = document.getElementById("togglePassword");
      var submitted = false;

      openButton.addEventListener("click", function () {
        cardWrap.classList.add("show");
      });

      toggleButton.addEventListener("click", function () {
        var type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        toggleButton.setAttribute("aria-label", type === "password" ? "Tampilkan password" : "Sembunyikan password");
      });

      resetButton.addEventListener("click", function () {
        form.reset();
        alertBox.classList.remove("show");
        passwordInput.setAttribute("type", "password");
        usernameInput.focus();
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (submitted) {
          return;
        }

        submitted = true;

        var username = usernameInput.value.trim();
        var password = passwordInput.value;

        if (!username || !password) {
          alertBox.textContent = "Username dan password wajib diisi.";
          alertBox.classList.add("show");
          submitted = false;
          return;
        }

        if (username === "Admin" && password === "Admin") {
          setTimeout(function () {
            window.location.href = "index.html";
          }, 350);
          return;
        }

        alertBox.textContent = "Username atau password tidak cocok. Coba lagi.";
        alertBox.classList.add("show");
        submitted = false;
        passwordInput.focus();
      });
    })();
  </script>
</body>
</html>
